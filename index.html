<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trecks Visualizer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body { margin:0; padding:0; font-family:sans-serif; }

        #app { display:flex; height:100vh; }

        #sidebar {
            width: min(340px, 85vw);
            display:flex; flex-direction:column;
            background:#fff; border-right:1px solid #ddd;
            z-index: 1100;
        }
        #app.collapsed #sidebar { display:none; }

        #sidebar-head {
            display:flex; gap:6px; align-items:center;
            padding:10px; border-bottom:1px solid #eee;
        }
        #sidebar-head b { font-size:15px; white-space:nowrap; }
        #search {
            flex:1; min-width:0; padding:6px 8px;
            border:1px solid #ccc; border-radius:6px; font-size:13px;
        }
        #close-sidebar {
            border:none; background:none; font-size:16px;
            cursor:pointer; color:#666; padding:2px 6px;
        }

        #chips { display:flex; flex-wrap:wrap; gap:6px; padding:8px 10px; border-bottom:1px solid #eee; }
        .chip {
            border:1px solid #ccc; background:#fff; border-radius:14px;
            padding:3px 10px; font-size:12px; cursor:pointer;
        }
        .chip.active { background:#2b5f9e; border-color:#2b5f9e; color:#fff; }

        #tracklist { flex:1; overflow-y:auto; }

        .track { padding:8px 12px; border-bottom:1px solid #f2f2f2; cursor:pointer; }
        .track:hover { background:#f6f9fd; }
        .track.selected { background:#e8f0fb; box-shadow: inset 4px 0 0 #2b5f9e; }
        .track.loading { opacity:0.5; pointer-events:none; }
        .track-main { display:flex; align-items:baseline; gap:8px; }
        .track-title { font-weight:600; font-size:13px; flex:1; min-width:0;
                       overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .track-date { font-size:12px; color:#888; white-space:nowrap; }
        .track-sub { font-size:12px; color:#555; margin-top:2px; }
        .badge {
            display:inline-block; font-size:11px; border-radius:4px;
            padding:1px 6px; background:#eee; color:#444; margin-right:6px;
        }
        .badge.Бег { background:#e8f5e9; color:#1b5e20; }
        .badge.Велосипед { background:#e3f2fd; color:#0d47a1; }



        #sidebar-foot { border-top:1px solid #eee; padding:10px; }
        #modes { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
        #modes button, #clear {
            border:1px solid #ccc; background:#fff; border-radius:6px;
            padding:5px 10px; font-size:12px; cursor:pointer;
        }
        #modes button.active { background:#2b5f9e; border-color:#2b5f9e; color:#fff; }
        #clear { width:100%; color:#a33; }
        #selection-info { font-size:12px; color:#555; margin-bottom:8px; min-height:15px; }

        #map { flex:1; }

        #open-sidebar {
            display:none; position:absolute; top:10px; left:10px; z-index:1001;
            border:1px solid #ccc; background:#fff; border-radius:6px;
            padding:6px 12px; font-size:14px; cursor:pointer;
            box-shadow:0 1px 4px rgba(0,0,0,0.3);
        }
        #app.collapsed #open-sidebar { display:block; }

        #tooltip {
            position:absolute; background:rgba(0,0,0,0.85); color:#fff; padding:8px 12px;
            border-radius:4px; pointer-events:none; display:none; z-index:2000;
            font-size:13px; white-space:nowrap;
        }

        #legend, #stats {
            position:absolute; z-index:900;
            background:rgba(255,255,255,0.95);
            padding:10px; border-radius:8px; font-size:13px;
            box-shadow:0 0 10px rgba(0,0,0,0.3);
        }
        #legend { bottom:20px; left:10px; }
        #stats { top:10px; right:10px; display:none; max-width:320px; }
        #stats table { border-collapse:collapse; }
        #stats td { border:1px solid #ccc; padding:3px 6px; }
        #ver { font-size:11px; color:#999; font-weight:normal; }
        #weight-row { display:flex; align-items:center; gap:8px;
                       font-size:12px; color:#555; margin-bottom:8px; }
        #weight { flex:1; }
        #player {
            position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
            z-index:1000; display:flex; gap:6px; align-items:center;
            background:rgba(255,255,255,0.95); padding:6px 10px;
            border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.3); font-size:13px;
        }
        #player button {
            border:1px solid #ccc; background:#fff; border-radius:6px;
            padding:4px 10px; font-size:13px; cursor:pointer;
        }
        #pl-info { color:#555; white-space:nowrap; }
    </style>
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <div id="sidebar-head">
                <b>Trecks <span id="ver"></span></b>
                <input id="search" type="search" placeholder="Поиск…">
                <button id="close-sidebar" title="Скрыть панель">✕</button>
            </div>
            <div id="chips"></div>
            <div id="tracklist"></div>
            <div id="sidebar-foot">
            <div id="weight-row">
                <span id="weight-label">Толщина линии: 6</span>
                <input id="weight" type="range" min="2" max="32" step="1" value="6">
            </div>
                <div id="modes"></div>
                <div id="selection-info"></div>
                <button id="clear">Очистить выбор</button>
            </div>
        </aside>
        <div id="map"></div>
    </div>
    <button id="open-sidebar">☰ Треки</button>
    <div id="tooltip"></div>
    <script src="app.js"></script>
</body>
</html>
